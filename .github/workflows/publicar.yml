# Publicação: gera o site a partir da main e envia à Cloudflare Pages.
# Roda às 08:00 e às 18:00 de Brasília (o GitHub pode atrasar o horário agendado em alguns minutos),
# a cada merge na main (para correções entrarem logo) e pelo botão "Run workflow".
# Só publica a matéria aprovada por merge humano cujo publicar_em já passou (gerador/gerar_site.py --producao).
#
# Desligado até o lançamento: o trabalho só roda com a variável do repositório PUBLICAR_ATIVO = sim
# (Settings > Secrets and variables > Actions > Variables). O envio à Cloudflare pede os segredos
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID; sem eles, o site é gerado e conferido, mas não é enviado.
name: publicar

on:
  schedule:
    - cron: "0 11 * * *"  # 08:00 em Brasília
    - cron: "0 21 * * *"  # 18:00 em Brasília
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    if: vars.PUBLICAR_ATIVO == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a trilha e a aprovação saem do histórico completo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Testes do gerador
        run: python -I -m unittest discover -s testes
      - name: Gerar o site (produção)
        run: python -I gerador/gerar_site.py --producao
      - name: Enviar à Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy _saida --project-name=today-ia-br --branch=main --commit-hash="$GITHUB_SHA"
